name: Publicar blog

# Dos entradas cada dos días, a las 09:00 UTC.
# Nota sobre el cron: */2 en el día del mes son los días 1,3,5…31, así que en
# los meses de 31 días el salto del 31 al 1 es de un día, no de dos.
on:
  schedule:
    - cron: '0 9 */2 * *'
  workflow_dispatch:
    inputs:
      cuantas:
        description: 'Cuántas entradas generar'
        required: false
        default: '2'

permissions:
  contents: write

concurrency:
  group: blog-autopublish
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Generar entradas
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: node scripts/generate-post.mjs "${{ github.event.inputs.cuantas || '2' }}"

      # El build valida el esquema de la colección de contenido. Si el modelo
      # devolvió algo que no encaja, esto falla y no se commitea nada.
      - name: Validar con el build
        run: npm run build

      - name: Commit y push
        run: |
          if [ -z "$(git status --porcelain src/content/blog)" ]; then
            echo "Sin entradas nuevas."
            exit 0
          fi
          git config user.name "maycolljaramillo01"
          git config user.email "maycolljaramillo01@gmail.com"
          git add src/content/blog
          nuevos=$(git diff --cached --name-only | xargs -n1 basename | sed 's/\.md$//' | paste -sd', ')
          git commit -m "Publica: ${nuevos}"
          git push
